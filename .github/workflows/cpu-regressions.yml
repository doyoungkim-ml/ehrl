name: RL foundation CPU regressions

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tests/requirements/cpu.txt
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r tests/requirements/cpu.txt build
      - name: Prepare exact VeRL source
        env:
          RLLM_TEST_VERL_SOURCE: ${{ runner.temp }}/verl-source
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          manifest = json.loads(Path('compat/verl/manifest.json').read_text())
          source = Path(os.environ['RLLM_TEST_VERL_SOURCE'])
          subprocess.run(['git', 'init', str(source)], check=True)
          subprocess.run(['git', '-C', str(source), 'fetch', '--depth=1', manifest['upstream'], manifest['base_revision']], check=True)
          subprocess.run(['git', '-C', str(source), 'checkout', '--detach', 'FETCH_HEAD'], check=True)
          PY
          python scripts/verify_verl_compat.py --source "$RLLM_TEST_VERL_SOURCE" --apply
      - name: Run CPU regression gates (no skips)
        run: python scripts/run_cpu_regressions.py --verl-source "${{ runner.temp }}/verl-source" --report-dir "${{ runner.temp }}/cpu-reports"
      - name: Check setup syntax and build wheel
        run: |
          bash -n scripts/setup_qwen35.sh scripts/gpu_venv.sh scripts/training_runtime.sh examples/*/train/*/train.slurm examples/*/eval/*/eval.slurm
          python -m build --wheel
          python scripts/check_foundation_wheel.py dist/*.whl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-regression-reports
          path: ${{ runner.temp }}/cpu-reports
